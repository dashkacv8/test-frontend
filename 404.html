<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — ПикмиПицца</title>
  <link rel="icon" type="image/png" href="/img/pngtree-heart-pizza-with-salami-png-image_20830282.png">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #fff0e3;
      color: #3a1024;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .code {
      font-family: 'Baloo 2', sans-serif;
      font-weight: 800;
      font-size: clamp(5rem, 22vw, 10rem);
      line-height: 1;
      color: #ff2e7e;
      -webkit-text-stroke: 3px #3a1024;
      paint-order: stroke fill;
      text-shadow: 6px 6px 0 #3a1024;
    }
    .code span { display: inline-block; animation: spin 6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-family: 'Baloo 2', sans-serif; font-size: 1.8rem; margin: 8px 0 10px; }
    p { max-width: 420px; line-height: 1.5; color: #6e2a48; margin-bottom: 26px; }
    a {
      display: inline-block;
      padding: 14px 34px;
      border-radius: 60px;
      text-decoration: none;
      font-weight: 700;
      color: #fff;
      background: #ff2e7e;
      border: 3px solid #3a1024;
      box-shadow: 4px 4px 0 #3a1024;
    }
    @media (prefers-reduced-motion: reduce) { .code span { animation: none; } }
  </style>
</head>
<body>
  <div class="code">4<span>🍕</span>4</div>
  <h1>Такой страницы у нас нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Зато пицца на месте — возвращайтесь в меню.</p>
  <a href="/">Вернуться в меню</a>
</body>
</html>
